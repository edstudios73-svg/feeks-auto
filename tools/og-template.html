<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#040404;color:#fff;font-family:Manrope,sans-serif;position:relative}
.photo{position:absolute;right:0;top:0;width:760px;height:630px;object-fit:cover}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#040404 30%,rgba(4,4,4,.85) 44%,rgba(4,4,4,.15) 66%,rgba(4,4,4,0) 80%),linear-gradient(0deg,rgba(4,4,4,.7),rgba(4,4,4,0) 35%)}
.glow{position:absolute;left:-200px;top:-260px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 65%)}
.logo{position:absolute;left:64px;top:56px;width:220px}
.txt{position:absolute;left:64px;top:190px;width:560px}
.eyebrow{font-size:15px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6)}
h1{margin-top:18px;font-family:"Cormorant Garamond";font-weight:600;font-size:var(--fs,76px);line-height:.98;letter-spacing:-.005em}
.rule{display:flex;align-items:center;gap:16px;margin-top:26px;font-family:"Cormorant Garamond";font-style:italic;font-size:26px;color:rgba(255,255,255,.85)}
.rule i{width:56px;height:1px;background:rgba(255,255,255,.6)}
.plate{position:absolute;left:64px;bottom:52px;display:flex;align-items:center;gap:22px;padding:14px 26px 14px 22px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(18px)}
.plate b{font-size:22px;font-weight:700;letter-spacing:.02em}
.plate span{font-size:17px;color:rgba(255,255,255,.7)}
.year{position:absolute;right:44px;top:44px;padding:12px 22px;border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);backdrop-filter:blur(18px);font-family:"Cormorant Garamond";font-weight:600;font-size:34px;line-height:1}
.frame{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.14);border-radius:26px;pointer-events:none}
</style></head>
<body>
<img class="photo" id="photo" src="">
<div class="fade"></div><div class="glow"></div>
<img class="logo" src="../img/brand/logo-white.svg">
<div class="txt">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="name"></h1>
  <p class="rule"><i></i>Rentals · Escorts · Events</p>
</div>
<div class="plate"><b>Book on WhatsApp</b><span>024 700 4120 · East Legon, Accra</span></div>
<div class="year" id="year"></div>
<div class="frame"></div>
</body></html>

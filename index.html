{"@context":"https://schema.org","@type":"AutoRental","name":"Signature Motors","url":"https://signature-motors-gh.vercel.app/","logo":"https://signature-motors-gh.vercel.app/img/brand/logo-black.png","telephone":"+233247004120","address":{"@type":"PostalAddress","streetAddress":"Jungle Avenue Road","addressLocality":"East Legon, Accra","addressCountry":"GH"},"description":"Car rentals, VIP escorts and event cars in Accra."}
</script>
</head>
<body>
<a class="skip" href="#explore">Skip to the fleet</a>
<main class="landing">
  <figure class="landing__frame">
    <img class="landing__photo" src="/img/cars/bmw-x6-2022-tall.jpg" alt="A black BMW X6 parked under palm trees in Accra" width="810" height="1263" fetchpriority="high">
    <a class="landing__chip" href="/fleet">
      <span>The fleet · Accra</span>
      <strong>Explore the cars</strong>
      <span>Rentals · Escorts · Events</span>
    </a>
    <span class="landing__badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>Quick booking</span>
  </figure>

  <section class="landing__content" aria-labelledby="title">
    <p class="eyebrow">Rentals · Escorts · Events · Accra</p>
    <h1 id="title">Arrive in <em>signature style.</em></h1>
    <a class="slide" href="/fleet" id="explore" aria-label="Explore the fleet" draggable="false">
      <span class="slide__fill" aria-hidden="true"></span>
      <span class="slide__knob" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3.5 13.5l1.8-5.1A2 2 0 0 1 7.2 7h9.6a2 2 0 0 1 1.9 1.4l1.8 5.1"/><rect x="2.5" y="13" width="19" height="5" rx="1.5"/></svg></span>
      <span class="slide__text">Slide to explore</span>
      <span class="slide__chev" aria-hidden="true"><i></i><i></i><i></i></span>
    </a>
  </section>
</main>
<script type="module">
  import { header } from '/assets/js/ui.js';
  header('').classList.add('top--float');

  // Slide to explore: drag the knob to the end, or tap the bar.
  const slide = document.getElementById('explore');
  const knob = slide.querySelector('.slide__knob');
  const fill = slide.querySelector('.slide__fill');
  let startX = null, dx = 0, moved = false;
  const maxX = () => slide.clientWidth - knob.offsetWidth - 12;
  const set = (x) => { knob.style.transform = `translateX(${x}px)`; fill.style.width = `${x + knob.offsetWidth + 6}px`; };
  knob.addEventListener('pointerdown', (e) => { startX = e.clientX; dx = 0; moved = false; slide.classList.add('is-dragging'); knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', (e) => {
    if (startX === null) return;
    dx = Math.max(0, Math.min(maxX(), e.clientX - startX));
    if (dx > 4) moved = true;
    set(dx);
  });
  const end = () => {
    if (startX === null) return;
    startX = null;
    slide.classList.remove('is-dragging');
    if (dx > maxX() * 0.75) { set(maxX()); location.href = '/fleet'; }
    else { knob.style.transform = ''; fill.style.width = '0'; }
  };
  knob.addEventListener('pointerup', end);
  knob.addEventListener('pointercancel', end);
  slide.addEventListener('click', (e) => { if (moved) e.preventDefault(); });
</script>
</body>
</html>

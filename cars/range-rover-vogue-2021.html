<!doctype html>
<html lang="en">
<head>
<!-- Generated by tools/build-pages.mjs from car.html. Edit car.html, then rebuild. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2021 Range Rover Vogue Autobiography | Signature Motors</title>
<meta name="description" content="Book the 2021 Range Rover Vogue Autobiography for a rental, VIP escort or event in Accra. Signature Motors, East Legon, Accra. WhatsApp 024 700 4120.">
<link rel="canonical" href="https://signature-motors-gh.vercel.app/cars/range-rover-vogue-2021">

<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<a class="skip" href="#panel">Skip to booking</a>
<main id="main"></main>
<script type="module">
  import { CARS, SERVICES, BUSINESS, GOOD_TO_KNOW } from '/assets/js/data.js';
  import { header, icon, esc, $, $$, carImg, carCard, priceLabel, money, calendar, stepper, fmt, quote, bookingDays, wireShare, share, isValidDate } from '/assets/js/ui.js';

  header('fleet');
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  const car = CARS.find((c) => c.slug === slug);
  const main = $('#main');

  if (!car) {
    document.title = 'Car not found | Signature Motors';
    main.className = 'wrap';
    main.innerHTML = `<div class="glass empty" style="margin-top:40px"><h1 class="serif" style="font-size:34px;margin:0 0 8px">We couldn't find that car</h1><p>It may have been renamed or taken out of the fleet.</p><a class="btn" href="/fleet">See the fleet</a></div>`;
    throw new Error('Unknown car');
  }

  const params = new URLSearchParams(location.search);
  const b = {
    car: car.slug,
    service: SERVICES[params.get('service')] ? params.get('service') : 'rental',
    start: isValidDate(params.get('start')) ? params.get('start') : null,
    end: isValidDate(params.get('end')) ? params.get('end') : null,
    count: Math.max(1, Math.min(20, Number(params.get('count')) || 1)),
    driver: params.get('driver') === 'self' ? 'self' : 'with',
  };
  const title = `${car.year} ${car.name}`;
  document.title = `${title} | Signature Motors`;
  $('meta[name="description"]').content = `Book the ${title} with Signature Motors in ${BUSINESS.area}: rentals, VIP escorts and event cars.`;
  const p = priceLabel(car, 'rental');
  const others = CARS.filter((c) => c.slug !== car.slug).sort((a, z) => (z.body === car.body) - (a.body === car.body) || z.year - a.year).slice(0, 3);
  const use = car.luxury ? 'VIP escorts, weddings and business travel' : 'everyday rentals, trips and events';

  main.innerHTML = `
    <section class="car-hero">
      <img src="${carImg(car, true)}" alt="${esc(title)} in ${car.colour.toLowerCase()}" style="object-position:${car.hero ? '50% 80%' : (car.pos || '50% 55%')}" fetchpriority="high">
      <div class="car-hero__bar">
        <a class="icon-btn" href="/fleet" aria-label="Back to the fleet">${icon('back')}</a>
        <div>
          <button class="icon-btn" type="button" id="share" aria-label="Share this car">${icon('share')}</button>
          <span class="pill">${car.body}${car.luxury ? ' · Signature' : ''}</span>
        </div>
      </div>
      <div class="car-hero__info">
        <div>
          <h1>${esc(car.name)}</h1>
          <p class="loc">${icon('pin')}${BUSINESS.area}</p>
        </div>
        <div class="car-hero__price"><strong>${p.amount}</strong><span>${p.unit ? 'per day' : 'price per booking'}</span></div>
      </div>
    </section>
    <div class="facts-strip glass">
      <div><strong>${icon('year')}${car.year}</strong><span>Year</span></div>
      <div><strong>${icon('car')}${car.body}</strong><span>Body</span></div>
      <div><strong>${icon("wheel")}Optional</strong><span>Driver</span></div>
    </div>
    <nav class="tabs" aria-label="On this page">
      <a href="#overview" class="is-on">Overview</a><a href="#features">Features</a><a href="#services">Services</a><a href="#rates">Rates</a><a href="#availability">Availability</a><a href="#good-to-know">Good to know</a>
    </nav>
    <div class="wrap detail">
      <div>
        <section class="block" id="overview">
          <h2>About this car</h2>
          <p>A ${car.colour.toLowerCase()} ${esc(title)}, kept clean and ready for ${use}.</p>
          <p class="muted">Book it on its own for a rental, as part of an escort or convoy, or for your event. Choose your dates and we'll confirm availability and price on WhatsApp.</p>
        </section>
        <section class="block" id="features">
          <h2>Features</h2>
          <ul class="amen">
            ${car.feats.map((f) => `<li>${icon('spark')}${esc(f)}</li>`).join('')}
            <li>${icon('car')}${car.body}</li>
            <li>${icon('wheel')}Driver on request</li>
          </ul>
          <ul class="ticks">
            <li>${icon('check')}Cleaned before every booking</li>
            <li>${icon('check')}Available for rentals, escorts and events</li>
            <li>${icon('check')}Book from today, up to 12 months ahead</li>
            <li>${icon('check')}Managed directly by ${BUSINESS.name}</li>
          </ul>
        </section>
        <section class="block" id="services">
          <h2>Book it for</h2>
          <div class="svc-list">
            ${Object.entries(SERVICES).map(([id, s]) => `<div class="svc-item"><div><h3>${s.label}</h3><p>${s.blurb}</p></div><button class="btn btn--sm btn--outline" type="button" data-pick="${id}">Choose</button></div>`).join('')}
          </div>
        </section>
        <section class="block" id="rates">
          <h2>Rates</h2>
          <p class="muted small">Prices in Ghanaian Cedis, confirmed in writing before you pay anything.</p>
          <div class="rates">
            ${Object.entries(SERVICES).map(([id, s]) => { const v = car.price?.[id]; return `<div class="rate"><span>${s.label}</span><strong>${v ? `${money(v)} <small class="muted">/ ${s.unit}</small>` : 'On request'}</strong></div>`; }).join('')}
          </div>
        </section>
        <section class="block" id="availability">
          <h2>Availability</h2>
          <p class="muted small">Pick a date to start your booking. We confirm the car is free when you send your request.</p>
          <div class="glass cal-card"><div class="cal" id="cal-page"></div>
            <div class="legend"><span><i></i>Open</span><span class="is-yours"><i></i>Your dates</span><button class="btn btn--sm btn--outline" type="button" id="clear-dates">Clear</button></div>
          </div>
        </section>
        <section class="block" id="good-to-know">
          <h2>Good to know</h2>
          <ul class="ticks">${GOOD_TO_KNOW.map((g) => `<li>${icon('check')}${esc(g)}</li>`).join('')}</ul>
        </section>
      </div>

      <form class="panel glass" id="panel" aria-labelledby="panel-title" novalidate>
        <div class="panel__head">
          <h2 id="panel-title">Reserve this car</h2>
          <p class="panel__price"><strong>${p.amount}</strong> <span>${p.unit ? '/ day' : ''}</span></p>
          <button class="icon-btn panel__close" type="button" id="close" aria-label="Close">${icon('close')}</button>
        </div>
        <div class="seg seg--full" id="svc" role="group" aria-label="Service"></div>
        <div class="field-pair" id="dates" style="margin-top:12px"><div><span id="d1-label">Pickup</span><strong id="d1"></strong></div><div><span>Return</span><strong id="d2"></strong></div></div>
        <div class="cal" id="cal-panel"></div>
        <div class="opt" id="opt-driver"><div><span>Driver</span><strong id="driver-label"></strong></div><div class="seg" role="group" aria-label="Driver"><button type="button" data-driver="with">With driver</button><button type="button" data-driver="self">Self-drive</button></div></div>
        <div class="opt" id="opt-count"><div><span>Cars needed</span><strong id="count-label"></strong></div><div id="count"></div></div>
        <div class="sum" id="sum"></div>
        <p class="err" id="panel-err" role="alert" hidden></p>
        <button class="btn btn--lg btn--block" type="submit" id="reserve">Reserve now</button>
        <p class="panel__note">No payment now. We confirm availability and price on WhatsApp.</p>
      </form>
    </div>
    <div class="wrap related">
      <h2>You may also like</h2>
      <div class="grid" style="margin-top:0">${others.map((c) => carCard(c, b.service)).join('')}</div>
    </div>
    <div class="bar" id="bar">
      <div><strong>${p.amount}</strong> <span class="muted">${p.unit ? '/ day' : ''}</span><small id="bar-note">Add dates for your booking</small></div>
      <button class="btn" type="button" id="open">Reserve</button>
    </div>
    <div class="sheet-back" id="back"></div>`;
  wireShare();

  // ---------------------------------------------------------------- Booking state
  const calPage = calendar($('#cal-page'), { mode: SERVICES[b.service].dates, start: b.start, end: b.end, onChange: (s, e) => setDates(s, e, 'page') });
  const calPanel = calendar($('#cal-panel'), { mode: SERVICES[b.service].dates, start: b.start, end: b.end, onChange: (s, e) => setDates(s, e, 'panel') });
  const count = stepper($('#count'), { value: b.count, max: 20, label: 'cars', onChange: (v) => { b.count = v; update(); } });

  function setDates(s, e, from) {
    b.start = s; b.end = e;
    (from === 'page' ? calPanel : calPage).set({ start: s, end: e });
    if (from === 'page' && s && !matchMedia('(min-width: 1024px)').matches && (SERVICES[b.service].dates === 'single' || e)) openSheet();
    update();
  }
  function update() {
    const s = SERVICES[b.service];
    $('#svc').innerHTML = Object.entries(SERVICES).map(([id, v]) => `<button type="button" data-svc="${id}" aria-pressed="${id === b.service}">${v.label}</button>`).join('');
    $('#dates').classList.toggle('is-single', s.dates === 'single');
    $('#d1-label').textContent = s.dates === 'single' ? 'Date' : 'Pickup';
    $('#d1').textContent = b.start ? fmt(b.start) : 'Add date';
    $('#d1').classList.toggle('is-empty', !b.start);
    $('#d2').textContent = b.end ? fmt(b.end) : 'Add date';
    $('#d2').classList.toggle('is-empty', !b.end);
    $('#opt-driver').hidden = b.service !== 'rental';
    $('#opt-count').hidden = b.service === 'rental';
    $$('[data-driver]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.driver === b.driver));
    $('#driver-label').textContent = b.driver === 'self' ? 'Self-drive' : 'With driver';
    $('#count-label').textContent = `${b.count} car${b.count > 1 ? 's' : ''}`;

    const ready = s.dates === 'single' ? !!b.start : !!(b.start && b.end);
    const q = ready ? quote(b) : null;
    let rows = '';
    if (ready) {
      const n = bookingDays(b);
      const what = b.service === 'rental' ? `${n} day${n > 1 ? 's' : ''}, ${b.driver === 'self' ? 'self-drive' : 'with driver'}` : `${b.count} car${b.count > 1 ? 's' : ''} on ${fmt(b.start)}`;
      rows = q
        ? `<div><span>${q.label}</span><span>${money(q.total)}</span></div><div class="total"><span>Estimate</span><span>${money(q.total, true)}</span></div>`
        : `<div><span>${s.label}</span><span>${what}</span></div><div class="total"><span>Price</span><span>Confirmed on WhatsApp</span></div>`;
    }
    $('#sum').innerHTML = rows;
    $('#sum').hidden = !ready;
    $('#bar-note').textContent = ready ? (s.dates === 'single' ? fmt(b.start) : `${fmt(b.start)} to ${fmt(b.end)}`) : 'Add dates for your booking';
    $('#panel-err').hidden = true;
    const qp = new URLSearchParams();
    if (b.service !== 'rental') qp.set('service', b.service);
    if (b.start) qp.set('start', b.start);
    if (b.end) qp.set('end', b.end);
    history.replaceState(null, '', location.pathname + (qp.toString() ? `?${qp}` : '') + location.hash);
  }
  function setService(id) {
    b.service = id;
    const mode = SERVICES[id].dates;
    if (mode === 'single') b.end = null;
    calPage.set({ mode, start: b.start, end: b.end });
    calPanel.set({ mode, start: b.start, end: b.end });
    update();
  }

  // ---------------------------------------------------------------- Sheet
  const openSheet = () => { document.body.classList.add('is-sheet-open'); setTimeout(() => $('#panel').focus?.(), 50); };
  const closeSheet = () => document.body.classList.remove('is-sheet-open');
  $('#panel').tabIndex = -1;
  $('#open').addEventListener('click', openSheet);
  $('#close').addEventListener('click', closeSheet);
  $('#back').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  $('#share').addEventListener('click', () => share(`/cars/${car.slug}`, car.name));
  $('#clear-dates').addEventListener('click', () => { calPage.clear(); });

  document.addEventListener('click', (e) => {
    const svc = e.target.closest('[data-svc]');
    if (svc) setService(svc.dataset.svc);
    const pick = e.target.closest('[data-pick]');
    if (pick) { setService(pick.dataset.pick); if (matchMedia('(min-width: 1024px)').matches) $('#panel').scrollIntoView({ behavior: 'smooth', block: 'center' }); else openSheet(); }
    const drv = e.target.closest('[data-driver]');
    if (drv) { b.driver = drv.dataset.driver; update(); }
  });

  // Reserve: go to checkout with everything chosen so far
  $('#panel').addEventListener('submit', (e) => {
    e.preventDefault();
    const s = SERVICES[b.service];
    if (!b.start || (s.dates === 'range' && !b.end)) {
      $('#panel-err').textContent = s.dates === 'range' ? (b.start ? 'Choose a return date.' : 'Choose your pickup and return dates.') : 'Choose the date you need the car.';
      $('#panel-err').hidden = false;
      return;
    }
    const qp = new URLSearchParams({ car: b.car, service: b.service, start: b.start });
    if (b.end) qp.set('end', b.end);
    if (b.service === 'rental') qp.set('driver', b.driver); else qp.set('count', b.count);
    location.href = `/booking?${qp}`;
  });

  // Tabs follow the scroll position
  const links = $$('.tabs a');
  const io = new IntersectionObserver((entries) => entries.forEach((en) => {
    if (en.isIntersecting) links.forEach((l) => l.classList.toggle('is-on', l.getAttribute('href') === `#${en.target.id}`));
  }), { rootMargin: '-45% 0px -50% 0px' });
  $$('.block').forEach((s) => io.observe(s));

  update();
  if (params.get('book') === '1' || location.hash === '#book') setTimeout(openSheet, 250);
</script>
</body>
</html>
